# Android App Links use the public SHA-256 fingerprint of the private release
# signing certificate. The private key and its password never enter this repo.
server {
    listen 80;
    server_name lovedoves.yalpani.com;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lovedoves.yalpani.com;

    access_log off;
    ssl_certificate /etc/letsencrypt/live/lovedoves.yalpani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lovedoves.yalpani.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LoveDovesSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cache-Control "no-store" always;

    location = /.well-known/assetlinks.json {
        default_type application/json;
        return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.yalpani.lovedoves","sha256_cert_fingerprints":["0F:86:43:0D:94:29:13:B3:2F:69:EA:0B:CB:25:17:92:DB:C9:1D:80:73:5F:58:AD:7E:FC:3D:B3:9A:66:C8:CE"]}}]';
    }

    location = /i {
        default_type text/plain;
        return 200 'Öffne diesen Einladungslink mit Love Doves. Das Einladungsgeheimnis bleibt im URL-Fragment und wird nicht an diesen Server gesendet.\n';
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        client_max_body_size 21m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://lovedoves-relay:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
