# Android App Links use the public SHA-256 fingerprint of the private release
# signing certificate. The private key and its password never enter this repo.
server {
    listen 80;
    server_name lovedoves.yalpani.com;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lovedoves.yalpani.com;

    access_log off;
    ssl_certificate /etc/letsencrypt/live/lovedoves.yalpani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lovedoves.yalpani.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LoveDovesSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cache-Control "no-store" always;

    location = /.well-known/assetlinks.json {
        default_type application/json;
        return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.yalpani.lovedoves","sha256_cert_fingerprints":["0F:86:43:0D:94:29:13:B3:2F:69:EA:0B:CB:25:17:92:DB:C9:1D:80:73:5F:58:AD:7E:FC:3D:B3:9A:66:C8:CE"]}}]';
    }

    location = /i {
        default_type text/plain;
        return 200 'Öffne diesen Einladungslink mit Love Doves. Das Einladungsgeheimnis bleibt im URL-Fragment und wird nicht an diesen Server gesendet.\n';
    }

    location = /admin {
        return 308 /admin/;
    }

    location = /admin/abgemeldet {
        default_type text/html;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        return 200 '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abgemeldet · Love Doves</title><style>*{box-sizing:border-box;font-weight:400}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f7f5f0;color:#18201c;font:18px/26px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,520px);padding:32px;border:1px solid #e6e9ec;border-radius:22px;background:#fff}h1{margin:0 0 16px;font-size:32px;line-height:36px}p{margin:0 0 24px;color:#53605a}a{color:#18201c;text-underline-offset:4px}</style></head><body><main><h1>Abgemeldet.</h1><p>Deine Love-Doves-Admin-Sitzung ist beendet.</p><a href="/admin/">Wieder anmelden</a></main></body></html>';
    }

    location = /oauth2/sign_out {
        proxy_pass http://lovedoves-admin-auth:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Redirect https://$host/admin/abgemeldet;
    }

    location /oauth2/ {
        proxy_pass http://lovedoves-admin-auth:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://lovedoves-admin-auth:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location @oauth2_signin {
        return 302 /oauth2/sign_in?rd=%2Fadmin%2F;
    }

    location /admin/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        auth_request_set $admin_email $upstream_http_x_auth_request_email;

        proxy_pass http://lovedoves-relay:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Love-Doves-Admin-Email $admin_email;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        client_max_body_size 21m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://lovedoves-relay:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Love-Doves-Admin-Email "";
    }
}
