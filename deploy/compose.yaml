services:
  relay:
    build:
      context: ../relay
    image: lovedoves-relay:local
    container_name: lovedoves-relay
    restart: unless-stopped
    env_file:
      - /opt/lovedoves/config/relay.env
    volumes:
      - /opt/lovedoves/data:/data
    networks:
      - graphula
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m

networks:
  graphula:
    external: true
    name: graphula_graphula-network
