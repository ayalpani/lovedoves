# Temporary HTTP-only vhost used while the DNS record and first certificate are created.
# Replace this file with lovedoves.nginx.conf immediately after ACME succeeds.
server {
    listen 80;
    server_name lovedoves.yalpani.com;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        client_max_body_size 21m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://lovedoves-relay:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Love-Doves-Admin-Email "";
    }
}
